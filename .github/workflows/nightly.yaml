name: Nightly Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# Krew AI Agent Nightly Build Pipeline (ADR-R7P3K)
# Automated bleeding-edge daily release for Krew Agent CLI & Engine
# Triggered daily on schedule from branch 'main' or via manual dispatch
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 2 * * *'                      # Nightly build at 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run compilation without publishing release assets'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: nightly-krew-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Prepare Nightly Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      track: nightly
      is_prerelease: "true"
    steps:
      - name: Generate Version Tag
        id: meta
        run: |
          DATE_TAG="$(date -u +%Y%m%d)"
          VER="v0.3.0-nightly.${DATE_TAG}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Generated Krew Nightly Version: ${VER}"

  quality-gate:
    name: Quality Gate & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Provision First-Party Dependencies
        run: |
          mkdir -p ..
          for repo in krewire hub tui ui auth cloud dash; do
            if [ ! -d "../${repo}" ]; then
              echo "Cloning krewire/${repo}..."
              git clone --depth 1 "https://github.com/krewire/${repo}.git" "../${repo}"
            fi
          done

      - name: Formatting Check
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt unformatted files: $UNFORMATTED"
            exit 1
          fi

      - name: Module Manifest Verification
        run: |
          for mod in cli conformance core version; do
            echo "▶ Verifying module manifests in ${mod}..."
            (cd "${mod}" && go mod verify)
          done

      - name: Static Analysis
        run: go vet ./cli/... ./conformance/... ./core/... ./version/...

      - name: Unit & Conformance Tests
        run: go test -v ./cli/... ./conformance/... ./core/... ./version/...

      - name: Pure-Go Compilation Invariant
        run: CGO_ENABLED=0 go build ./cli/... ./conformance/... ./core/... ./version/...

  build-binaries:
    name: Cross-Compile krew Agent CLI (Nightly)
    needs: [classify, quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Provision First-Party Dependencies
        run: |
          mkdir -p ..
          for repo in krewire hub tui ui auth cloud dash; do
            if [ ! -d "../${repo}" ]; then
              echo "Cloning krewire/${repo}..."
              git clone --depth 1 "https://github.com/krewire/${repo}.git" "../${repo}"
            fi
          done

      - name: Compile Multi-Platform Binaries
        env:
          VER: ${{ needs.classify.outputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X 'github.com/krewire/krew/core/version.rawVersion=${VER}' -X 'github.com/krewire/krew/version.rawVersion=${VER}'"
          
          PLATFORMS=(
            "linux/amd64/krew-linux-amd64"
            "linux/arm64/krew-linux-arm64"
            "darwin/amd64/krew-darwin-amd64"
            "darwin/arm64/krew-darwin-arm64"
            "windows/amd64/krew-windows-amd64.exe"
          )
          
          for target in "${PLATFORMS[@]}"; do
            IFS="/" read -r OS ARCH OUT <<< "$target"
            echo "▶ Compiling ${OUT} (${OS}/${ARCH})..."
            GOOS=$OS GOARCH=$ARCH CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" -o "dist/${OUT}" ./cli
          done

      - name: Checksums
        run: |
          cd dist && sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: krew-nightly-${{ needs.classify.outputs.version }}
          path: dist/
          retention-days: 7

  publish-github-release:
    name: Publish Nightly GitHub Release
    needs: [classify, build-binaries]
    runs-on: ubuntu-latest
    if: inputs.dry_run != true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          name: krew-nightly-${{ needs.classify.outputs.version }}
          path: dist/

      - name: Create or Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.classify.outputs.version }}
          name: Krew Agent Engine ${{ needs.classify.outputs.version }} [nightly]
          body: |
            ## Krew Developer Toolchain — ${{ needs.classify.outputs.version }} (Nightly Build)
            
            **Track**: `nightly`
            **Commit**: `${{ github.sha }}\`
            **Build Date**: `$(date -u +"%Y-%m-%d %H:%M:%S UTC")`
            
            ### Binary Checksums (CGO_ENABLED=0 Pure Go)
            ```
            $(cat dist/checksums.txt)
            ```
          prerelease: true
          draft: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
